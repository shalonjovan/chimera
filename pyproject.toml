[project]
name = "chimera"
version = "0.1.0"
description = "Autonomous CTF Solver MCP Server"
readme = "README.md"
authors = [
    { name = "shalonjovan", email = "shalonjovan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "playwright>=1.61.0",
]

[project.scripts]
chimera = "chimera.__main__:main"
chimera-server = "chimera.__main__:main"
chimera-cli = "chimera.cli.app:cli"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
